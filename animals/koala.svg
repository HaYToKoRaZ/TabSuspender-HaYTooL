<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <linearGradient id="koalaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0aec0"/>
      <stop offset="100%" stop-color="#718096"/>
    </linearGradient>
    <linearGradient id="branchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b341e"/>
      <stop offset="100%" stop-color="#9c4221"/>
    </linearGradient>
  </defs>

  <!-- Tree Branch -->
  <path d="M 0 135 Q 100 120 200 130 L 200 148 Q 100 138 0 148 Z" fill="url(#branchGrad)"/>
  <path d="M 150 125 Q 170 110 185 118 Q 165 130 150 125 Z" fill="#48bb78"/>

  <!-- Body resting flat on branch -->
  <ellipse cx="102" cy="112" rx="52" ry="28" fill="url(#koalaGrad)"/>

  <!-- Head resting down -->
  <circle cx="62" cy="104" r="28" fill="url(#koalaGrad)"/>

  <!-- Fluffy Ears -->
  <circle cx="40" cy="80" r="16" fill="url(#koalaGrad)"/>
  <circle cx="40" cy="80" r="10" fill="#edf2f7"/>
  <circle cx="84" cy="80" r="16" fill="url(#koalaGrad)"/>
  <circle cx="84" cy="80" r="10" fill="#edf2f7"/>

  <!-- Big Dark Koala Oval Nose -->
  <ellipse cx="62" cy="106" rx="9" ry="14" fill="#2d3748"/>

  <!-- Cute Sleeping Eyes -->
  <path d="M 44 98 Q 49 104 54 98" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 70 98 Q 75 104 80 98" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Paws hanging over branch -->
  <ellipse cx="58" cy="132" rx="10" ry="8" fill="#4a5568"/>
  <ellipse cx="118" cy="132" rx="11" ry="8" fill="#4a5568"/>
  <ellipse cx="138" cy="130" rx="10" ry="7" fill="#4a5568"/>

  <!-- Floating Zzz's -->
  <text x="115" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="16" fill="#a0aec0">z</text>
  <text x="130" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="20" fill="#718096">z</text>
  <text x="150" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="25" fill="#4a5568">Z</text>
</svg>
