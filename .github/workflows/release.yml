name: Release Extension

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract extension version & name from manifest.json
        id: extract_meta
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          NAME="TabSuspender-HaYTooL"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "zip_name=${NAME}-v${VERSION}.zip" >> $GITHUB_OUTPUT

      - name: Create Web Store Zip Package
        run: |
          # Package all extension files excluding git, github and markdown files
          zip -r "${{ steps.extract_meta.outputs.zip_name }}" . \
            -x "*.git*" \
            -x ".github/*" \
            -x "*.zip" \
            -x "*.crx" \
            -x "README.md" \
            -x ".gitignore"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.extract_meta.outputs.version }}"
          name: "${{ steps.extract_meta.outputs.name }} v${{ steps.extract_meta.outputs.version }}"
          body: |
            ## 🚀 ${{ steps.extract_meta.outputs.name }} v${{ steps.extract_meta.outputs.version }}

            Automated release package for Chromium browsers (Manifest V3).

            ### 📦 Download & Installation:
            1. Download **`${{ steps.extract_meta.outputs.zip_name }}`** below.
            2. Extract the archive to a folder on your computer.
            3. Open `chrome://extensions` in your browser and enable **Developer mode**.
            4. Click **Load unpacked** and select the extracted folder.

            ### ✨ Key Features:
            - **⚡ Manifest V3 & Ultra-Lightweight:** Low resource footprint, instant tab restore.
            - **🎛️ Dual Suspension Modes:** Informative visual page or silent browser-level native discard.
            - **🐾 Sleeping Animal Mascots:** Cozy vector mascots (Cats, Dog, Panda, Koala) with live preview in settings.
            - **🎨 5 Dynamic Themes:** Light, Dark, Discord, YouTube, and Matrix.
            - **🔔 Smart RAM Savings Toast:** Real-time aggregated memory savings notification.
            - **☁️ GitHub Gist Cloud Sync:** One-click settings and whitelist backup across browsers.
            - **🔒 100% Offline-First:** Zero tracking, zero third-party scripts.
            - **🌍 Bilingual Support:** English (EN) and Turkish (TR).
          files: "${{ steps.extract_meta.outputs.zip_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
